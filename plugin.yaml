name: accord
version: 0.1.0.dev0
description: "Accord: durable non-expiring owner approval cards for consequential Hermes Agent tool calls."
author: Dominic Grieco
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - accord_list
  - accord_get
  - accord_demo_effect
  - accord_mock_publish
  - human_gate_list
  - human_gate_get
  - human_gate_demo_effect
  - human_gate_mock_publish
  - x_create_post
provides_hooks:
  - pre_tool_call
provides_middleware:
  - tool_execution
